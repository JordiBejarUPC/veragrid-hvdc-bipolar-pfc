name: FMU Host Validation

on:
  push:
    branches:
      - devel_dynamics
    paths:
      - 'src/VeraGridEngine/IO/fmu/**'
      - 'src/tests/FMI/**'
      - '.github/workflows/fmi-host-validation.yml'
  pull_request:
    branches:
      - devel_dynamics
    paths:
      - 'src/VeraGridEngine/IO/fmu/**'
      - 'src/tests/FMI/**'
      - '.github/workflows/fmi-host-validation.yml'
  workflow_dispatch:

jobs:
  fmi-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest fmpy cmake

      - name: Run FMI host-native tests
        run: |
          python -m pytest ./src/tests/FMI -q
