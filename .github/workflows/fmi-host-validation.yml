name: FMU Host Validation

on:
  push:
    branches:
      - devel_dynamics
      - devel_dynamics_rebuild
    paths:
      - 'src/VeraGridEngine/IO/fmu/**'
      - 'src/tests/FMI/**'
      - 'requirements.txt'
      - '.github/workflows/fmi-host-validation.yml'
  pull_request:
    branches:
      - devel_dynamics
      - devel_dynamics_rebuild
    paths:
      - 'src/VeraGridEngine/IO/fmu/**'
      - 'src/tests/FMI/**'
      - 'requirements.txt'
      - '.github/workflows/fmi-host-validation.yml'
  workflow_dispatch:

jobs:
  fmi-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.11'
            fmpy-version: '0.3.26'
          - os: ubuntu-latest
            python-version: '3.12'
            fmpy-version: '0.3.31'
          - os: macos-latest
            python-version: '3.13'
            fmpy-version: '0.3.31'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest "fmpy==${{ matrix.fmpy-version }}" "cmake==4.4.2"

      - name: Run FMI host-native tests
        working-directory: ./src
        run: |
          python -m pytest ./tests/FMI -q --require-fmi-three-native-build
